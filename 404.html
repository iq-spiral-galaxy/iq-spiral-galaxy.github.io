<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Spiral Manifold</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/spiral-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Serif+Display&family=IBM+Plex+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--ink:#1a2440;--muted:#5f6b86;--faint:#65708a;--line:rgba(26,36,64,.13)}
*{margin:0;padding:0;box-sizing:border-box}
html{min-height:100%}
body{
  display:flex;align-items:center;justify-content:center;text-align:center;
  background:
    radial-gradient(circle at 82% 8%,rgba(17,19,24,.055),transparent 28%),
    radial-gradient(circle at 12% 88%,rgba(17,19,24,.035),transparent 26%),
    var(--bg);
  min-height:100vh;min-height:100dvh;color:var(--ink);font-family:'IBM Plex Sans KR',sans-serif;
  overflow-x:hidden;overflow-y:auto;padding:24px}
.wrap{position:relative;max-width:560px}
.manifold{position:relative;width:min(360px,82vw);margin:0 auto 6px}
.manifold img{display:block;width:100%;height:auto;opacity:.72;transform-origin:center}
.four04{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'DM Serif Display',Georgia,serif;font-size:86px;letter-spacing:-.04em;color:var(--ink)}
@media(prefers-reduced-motion:no-preference){
  .manifold img{animation:breathe 22s ease-in-out infinite alternate}
}
@keyframes breathe{from{transform:translateY(2px) scaleY(.994)}to{transform:translateY(-3px) scaleY(1.006)}}
h1{font-size:clamp(22px,5vw,29px);font-weight:700;margin-top:28px;letter-spacing:-.025em}
p{color:var(--muted);margin-top:12px;font-size:15px;line-height:1.8}
.btn{display:inline-flex;align-items:center;margin-top:30px;padding:12px 24px;border-radius:12px;
  border:1px solid var(--ink);font-size:14px;font-weight:600;color:#fff;text-decoration:none;
  background:var(--ink);box-shadow:0 12px 30px rgba(26,36,64,.14);transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(26,36,64,.2)}
.sos{margin-top:25px;font-family:'Bricolage Grotesque',sans-serif;font-size:11px;letter-spacing:.28em;color:var(--faint)}
@media(max-height:600px){
  .manifold{width:min(260px,62vw)}
  h1{margin-top:12px}p{margin-top:8px;line-height:1.6}.btn{margin-top:16px}.sos{margin-top:14px}
}
@media (prefers-reduced-motion: reduce){
  .manifold img{animation:none!important;transform:none!important}.btn{transition:none}.btn:hover{transform:none}
}
@media(forced-colors:active){.manifold img{display:none}}
</style>
</head>
<body>
<main class="wrap">
  <div class="manifold">
    <img src="/spacetime-warp.svg" alt="" aria-hidden="true" width="760" height="620">
    <div class="four04">404</div>
  </div>
  <h1>이 경로에는 페이지가 없습니다</h1>
  <p>찾는 페이지가 이 지식 공간에 없습니다.<br>연결이 이어지는 첫 화면으로 돌아가세요.</p>
  <a class="btn" href="/">홈으로 돌아가기</a>
  <div class="sos">PATH NOT FOUND</div>
</main>
</body>
</html>
