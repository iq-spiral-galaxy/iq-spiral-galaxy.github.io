<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Spiral Galaxy</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23ffffff'/%3E%3Cpath d='M16 16C19 12 25.5 12 27 17.5 28.4 23 24 29.5 16.5 28.2' stroke='%23a855f7' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Cpath d='M16 16C13 20 6.5 20 5 14.5 3.6 9 8 2.5 15.5 3.8' stroke='%23ec4899' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060e;--ink:#e9ebfb;--muted:#9aa0c6;--faint:#6b7099;--violet:#a855f7;--cyan:#38bdf8;--line:rgba(150,160,220,.14)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  display:flex;align-items:center;justify-content:center;text-align:center;
  background:
    radial-gradient(ellipse 80% 55% at 50% -10%, rgba(99,102,241,.18), transparent 60%),
    radial-gradient(ellipse 60% 45% at 80% 80%, rgba(236,72,153,.08), transparent 60%),
    var(--bg);
  color:var(--ink);font-family:'IBM Plex Sans KR',sans-serif;overflow:hidden;padding:24px}
body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.55;
  background-image:
    radial-gradient(1px 1px at 20% 30%, #fff, transparent),
    radial-gradient(1px 1px at 70% 65%, #cdd, transparent),
    radial-gradient(1.4px 1.4px at 40% 80%, #fff, transparent),
    radial-gradient(1px 1px at 88% 18%, #dde, transparent),
    radial-gradient(1px 1px at 58% 12%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 12% 62%, #bcd, transparent);
  background-repeat:repeat;background-size:480px 480px}
.wrap{position:relative;max-width:560px}
.orbit{position:relative;width:230px;height:230px;margin:0 auto 8px}
.orbit .ring{position:absolute;inset:0;border:1.5px dashed rgba(160,168,220,.3);border-radius:50%;
  animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.four04{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:86px;letter-spacing:.02em;
  background:linear-gradient(115deg,var(--violet),var(--cyan),#ec4899);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ship{position:absolute;top:-8px;left:50%;width:64px;height:64px;margin-left:-32px;
  animation:orbitfly 26s linear infinite;transform-origin:50% 123px}
@keyframes orbitfly{to{transform:rotate(-360deg)}}
.ship svg{width:100%;height:100%;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 0 12px rgba(168,85,247,.5))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(8deg)}50%{transform:translateY(-6px) rotate(-6deg)}}
h1{font-size:clamp(21px,5vw,28px);font-weight:700;margin-top:34px;letter-spacing:-.01em}
p{color:var(--muted);margin-top:12px;font-size:15px;font-weight:300;line-height:1.75}
.btn{display:inline-flex;align-items:center;gap:9px;margin-top:30px;padding:13px 28px;border-radius:999px;
  font-size:15px;font-weight:500;color:#fff;text-decoration:none;
  background:linear-gradient(100deg,var(--violet),#6366f1);
  box-shadow:0 8px 34px -10px rgba(124,92,255,.7);transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 40px -10px rgba(124,92,255,.85)}
.sos{margin-top:26px;font-family:'Bricolage Grotesque',sans-serif;font-size:11px;letter-spacing:.34em;color:var(--faint);
  animation:blink 2.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.ring,.ship,.ship svg,.sos{animation:none}}
</style>
</head>
<body>
<main class="wrap">
  <div class="orbit">
    <div class="ring"></div>
    <div class="four04">404</div>
    <div class="ship" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- 길 잃은 우주선 -->
        <ellipse cx="32" cy="38" rx="20" ry="8.5" fill="#2a2f4a" stroke="#8b93c8" stroke-width="1.6"/>
        <path d="M20 33.5C22 26 27 22 32 22s10 4 12 11.5" fill="#404a77"/>
        <circle cx="32" cy="29" r="6.5" fill="#9fd8ff" fill-opacity=".85" stroke="#cfeaff" stroke-width="1.4"/>
        <circle cx="24" cy="38.5" r="1.7" fill="#38bdf8"/>
        <circle cx="32" cy="40.5" r="1.7" fill="#a855f7"/>
        <circle cx="40" cy="38.5" r="1.7" fill="#ec4899"/>
        <path d="M26 46l-2.4 5M32 47.5v5.5M38 46l2.4 5" stroke="#7c86bd" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="1.5 3"/>
      </svg>
    </div>
  </div>
  <h1>이 좌표에는 행성이 없습니다</h1>
  <p>우주선이 항로를 벗어났네요.<br>지도에 없는 공허를 떠돌기 전에, 은하 중심으로 귀환하세요.</p>
  <a class="btn" href="/">🌌 은하로 돌아가기</a>
  <div class="sos">LOST IN SPACE</div>
</main>
</body>
</html>
