<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f6fb">
<title>페이지를 찾을 수 없습니다 — Armornite</title>
<link rel="icon" href="/spiral-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<style>
.error-page{min-height:100vh;display:grid;place-items:center;padding:32px}
.error-content{max-width:560px;text-align:center}
.error-code{color:var(--blue);font-size:6rem;font-weight:800;letter-spacing:-.07em;margin-top:32px;line-height:1}
.error-content h1{font-size:1.75rem;margin-top:24px}
.error-content p:not(.error-code){color:#57657a;margin-top:14px;line-height:1.9}
.error-content .button{margin-top:28px}
</style>
</head>
<body class="error-page">
<main class="error-content">
<a class="brand" href="/"><img src="/spiral-mark.svg" width="34" height="34" alt=""><span>Armornite</span></a>
<p class="error-code">404</p>
<h1>이 경로에는 페이지가 없습니다</h1>
<p>찾는 페이지가 이동했거나 주소가 달라졌을 수 있습니다<br>학습 분야를 살펴보고 배움을 이어가세요</p>
<a class="button" href="/#buddies">학습 분야로 돌아가기 →</a>
</main>
</body>
</html>
